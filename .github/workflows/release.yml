name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported tag '${tag}'. Expected v<major>.<minor>.<patch>, for example v1.0.0." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo "Version components are too large for the Android versionCode scheme." >&2
            exit 1
          fi

          version_name="${major}.${minor}.${patch}"
          version_code=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch}))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode ${version_code} is outside the supported range." >&2
            exit 1
          fi

          echo "name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "apk=BiliSponsorSkip-${tag}.apk" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in SIGNING_KEY KEY_ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required Actions secret ${variable} is not configured." >&2
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "${SIGNING_KEY}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks"

      - name: Test and build signed release APK
        shell: bash
        env:
          ORG_GRADLE_PROJECT_releaseVersionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_releaseVersionCode: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testReleaseUnitTest assembleRelease --warning-mode all

      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_APK: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "${source_apk}"
          mkdir -p dist
          cp "${source_apk}" "dist/${RELEASE_APK}"
          sha256sum "dist/${RELEASE_APK}" > "dist/${RELEASE_APK}.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APK: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${RELEASE_APK}" \
            "dist/${RELEASE_APK}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "BiliSponsorSkip ${GITHUB_REF_NAME}"
