name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported tag '${tag}'. Expected v<major>.<minor>.<patch>, for example v1.0.0." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo "Version components are too large for the Android versionCode scheme." >&2
            exit 1
          fi

          version_name="${major}.${minor}.${patch}"
          version_code=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch}))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode ${version_code} is outside the supported range." >&2
            exit 1
          fi

          echo "name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "apk=BiliSponsorSkip-${tag}.apk" >> "${GITHUB_OUTPUT}"

      - name: Prepare release notes and changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_CHANGELOG_FILE: ${{ runner.temp }}/CHANGELOG.release.md
          TAG_CHANGELOG_FILE: ${{ runner.temp }}/CHANGELOG.tag.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          section = re.search(
              r"^##[ \t]+Unreleased[ \t]*\r?\n(.*?)(?=^##[ \t]+|\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if section is None:
              raise SystemExit("CHANGELOG.md does not contain a '## Unreleased' section.")

          notes = section.group(1).strip()
          if not notes:
              raise SystemExit("The '## Unreleased' section in CHANGELOG.md is empty.")

          version = os.environ["RELEASE_VERSION"]
          released_changelog, replacements = re.subn(
              r"^##[ \t]+Unreleased[ \t]*$",
              f"## {version}",
              changelog,
              count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit("Failed to replace the Unreleased heading in CHANGELOG.md.")

          Path(os.environ["RELEASE_NOTES_FILE"]).write_text(notes + "\n", encoding="utf-8")
          Path(os.environ["RELEASE_CHANGELOG_FILE"]).write_text(released_changelog, encoding="utf-8")
          Path(os.environ["TAG_CHANGELOG_FILE"]).write_text(changelog, encoding="utf-8")
          PY

          echo "Release notes prepared from CHANGELOG.md:"
          cat "${RELEASE_NOTES_FILE}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_root}" || ! -d "${sdk_root}" ]]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME does not point to an Android SDK." >&2
            exit 1
          fi

          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_path}" ]]; then
            sdkmanager_path="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -x "${sdkmanager_path}" ]]; then
            sdkmanager_path="$(find "${sdk_root}/cmdline-tools" -maxdepth 3 -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "${sdkmanager_path}" || ! -x "${sdkmanager_path}" ]]; then
            echo "sdkmanager was not found under ${sdk_root}/cmdline-tools." >&2
            exit 1
          fi

          "${sdkmanager_path}" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in SIGNING_KEY KEY_ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required Actions secret ${variable} is not configured." >&2
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "${SIGNING_KEY}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks"

      - name: Test and build signed release APK
        shell: bash
        env:
          ORG_GRADLE_PROJECT_releaseVersionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_releaseVersionCode: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testReleaseUnitTest assembleRelease --warning-mode all

      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_APK: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "${source_apk}"
          mkdir -p dist
          cp "${source_apk}" "dist/${RELEASE_APK}"
          sha256sum "dist/${RELEASE_APK}" > "dist/${RELEASE_APK}.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APK: ${{ steps.version.outputs.apk }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/${RELEASE_APK}" \
              "dist/${RELEASE_APK}.sha256" \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --notes-file "${RELEASE_NOTES_FILE}" \
              --title "BiliSponsorSkip ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/${RELEASE_APK}" \
              "dist/${RELEASE_APK}.sha256" \
              --verify-tag \
              --notes-file "${RELEASE_NOTES_FILE}" \
              --title "BiliSponsorSkip ${GITHUB_REF_NAME}"
          fi

      - name: Commit released changelog
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_CHANGELOG_FILE: ${{ runner.temp }}/CHANGELOG.release.md
          TAG_CHANGELOG_FILE: ${{ runner.temp }}/CHANGELOG.tag.md
          DEFAULT_CHANGELOG_FILE: ${{ runner.temp }}/CHANGELOG.default.md
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${DEFAULT_BRANCH}"

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag commit ${GITHUB_SHA} is not part of origin/${DEFAULT_BRANCH}; refusing to update CHANGELOG.md." >&2
            exit 1
          fi

          git show "origin/${DEFAULT_BRANCH}:CHANGELOG.md" > "${DEFAULT_CHANGELOG_FILE}"
          if grep -Fqx "## ${RELEASE_VERSION}" "${DEFAULT_CHANGELOG_FILE}"; then
            echo "CHANGELOG.md already contains version ${RELEASE_VERSION}; nothing to commit."
            exit 0
          fi
          if ! cmp -s "${TAG_CHANGELOG_FILE}" "${DEFAULT_CHANGELOG_FILE}"; then
            echo "CHANGELOG.md changed on ${DEFAULT_BRANCH} after the tag was created; refusing to overwrite it." >&2
            exit 1
          fi

          git switch -C "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"
          cp "${RELEASE_CHANGELOG_FILE}" CHANGELOG.md
          git add CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: mark ${GITHUB_REF_NAME} as released [skip ci]"
          git push origin "HEAD:${DEFAULT_BRANCH}"
